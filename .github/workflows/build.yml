name: Build

# Builds the proxy DLL with MinGW-w64 and assembles the install package (proxy + ini + INSTALL.md +
# streamline/ with the pinned Streamline plugins and DLSS models) as the `fsr2dlss` artifact.
# Runs on pull requests, on demand, and as the build stage of release.yml (workflow_call).

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MinGW-w64 (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            unzip
            mingw-w64-x86_64-gcc

      - name: Cache third-party downloads
        uses: actions/cache@v6
        with:
          path: |
            deps/streamline-sdk-*.zip
          key: streamline-${{ hashFiles('third_party/streamline/SDK_VERSION') }}

      - name: Fetch dependencies (MinHook, Dear ImGui, Streamline SDK)
        run: src/fetch_deps.sh

      - name: Build and package
        run: src/build.sh

      - name: Check exports
        run: |
          objdump -p build/amd_fidelityfx_dx12.dll | tr -d '\r' | grep -E '^\s+\[\s*[0-9]+\] [A-Za-z_]' | awk '{print $NF}' | sort > exports.txt
          cat exports.txt
          for e in ffxCreateContext ffxDestroyContext ffxConfigure ffxQuery ffxDispatch; do grep -qx "$e" exports.txt || { echo "missing export $e"; exit 1; }; done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fsr2dlss
          path: dist/
          if-no-files-found: error
