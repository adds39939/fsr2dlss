name: Build

# Builds the proxy DLL with MinGW-w64 and assembles the install package (proxy + ini + INSTALL.md +
# streamline/ with the pinned Streamline plugins and DLSS models) as the `fsr2dlss` artifact.
# Runs on pull requests, on demand, and as the build stage of release.yml (workflow_call).

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MinGW-w64 (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            unzip
            mingw-w64-ucrt-x86_64-gcc

      - name: Cache third-party downloads
        uses: actions/cache@v6
        with:
          path: |
            deps/streamline-sdk-*.zip
          key: streamline-${{ hashFiles('third_party/streamline/SDK_VERSION') }}

      - name: Fetch dependencies (MinHook, Dear ImGui, Streamline SDK)
        run: src/fetch_deps.sh

      - name: Build and package
        run: |
          set -o pipefail
          if ! src/build.sh > build.log 2>&1; then
            echo "::error title=Build failed::$(grep -E 'error|Error|undefined reference' build.log | head -c 3500 | tr '\n' '|')"
            echo "::error title=Build log tail::$(tail -n 40 build.log | head -c 3500 | tr '\n' '|')"
            cat build.log
            exit 1
          fi
          cat build.log

      - name: Check exports
        run: |
          objdump -p build/amd_fidelityfx_dx12.dll | tr -d '\r' > objdump.txt
          # Names in the export table, independent of objdump's column layout.
          grep -oE '\bffx[A-Za-z]+\b' objdump.txt | sort -u > exports.txt
          echo "::notice title=Exports::$(tr '\n' ' ' < exports.txt)"
          echo "::notice title=Export table::$(grep -A12 'Ordinal/Name Pointer' objdump.txt | tr '\n' '|' | cut -c1-900)"
          cat exports.txt
          ok=1
          for e in ffxCreateContext ffxDestroyContext ffxConfigure ffxQuery ffxDispatch; do
            grep -qx "$e" exports.txt || { echo "::error title=Missing export::$e"; ok=0; }
          done
          [ "$ok" = 1 ] || { echo "::error title=objdump::$(head -c 900 objdump.txt | tr '\n' '|')"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fsr2dlss
          path: dist/
          if-no-files-found: error
